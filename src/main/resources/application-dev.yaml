server:
  port: 8084

spring:
  datasource:
    url: jdbc:h2:mem:operations_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

  security:
    user:
      name: admin
      password: admin123

springdoc:
  swagger-ui:
    path: /swagger-ui.html
