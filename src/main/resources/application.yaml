server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/operations_db
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    user:
      name: admin
      password: admin123

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true

jwt:
  algorithm: ${JWT_ALGORITHM:RS256}
  gateway-public-key: ${GATEWAY_JWT_PUBLIC_KEY:}
  service-private-key: ${SERVICE_JWT_PRIVATE_KEY}
  service-expires-in: ${SERVICE_JWT_EXPIRES_IN:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false