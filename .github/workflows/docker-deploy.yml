name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  # ---------------------------------------------------------------
  # CONFIGURE THESE IN YOUR REPOSITORY → Settings → Secrets and variables → Actions
  # ---------------------------------------------------------------
  # Required secrets:
  #   AZURE_CLIENT_ID        - Service principal / managed identity client ID
  #   AZURE_TENANT_ID        - Azure tenant ID
  #   AZURE_SUBSCRIPTION_ID  - Azure subscription ID
  #   ACR_USERNAME           - Azure Container Registry username
  #   ACR_PASSWORD           - Azure Container Registry password
  #   SPRING_DATASOURCE_PASSWORD - Azure MySQL password
  #   SERVICE_JWT_PRIVATE_KEY    - RSA private key PEM
  #   GATEWAY_JWT_PUBLIC_KEY     - Gateway RSA public key PEM
  #
  # Required variables (Settings → Variables, not Secrets):
  #   ACR_LOGIN_SERVER       - e.g. myregistry.azurecr.io
  #   RESOURCE_GROUP         - Azure resource group name
  #   CONTAINER_APP_NAME     - Azure Container App name
  # ---------------------------------------------------------------
  IMAGE_NAME: operations-service

jobs:
  build-and-push:
    name: Build JAR + Docker image → Push to ACR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build JAR (skip tests — already run above)
        run: ./mvnw clean package -DskipTests

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          containerAppName: ${{ vars.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ needs.build-and-push.outputs.image_tag }}
          environmentVariables: >
            SPRING_PROFILES_ACTIVE=prod
            SPRING_DATASOURCE_URL=jdbc:mysql://operations-mysql-server.mysql.database.azure.com:3306/operations_db?sslMode=REQUIRED
            SPRING_DATASOURCE_USERNAME=operationsadmin
            SPRING_DATASOURCE_PASSWORD=secretref:spring-datasource-password
            SERVICE_JWT_PRIVATE_KEY=secretref:service-jwt-private-key
            GATEWAY_JWT_PUBLIC_KEY=secretref:gateway-jwt-public-key
